services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: dfds
      POSTGRES_USER: dfds
      POSTGRES_PASSWORD: dfds
    ports:
      - "5432:5432"
    volumes:
      - dfds_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfds -d dfds"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dfds:dfds@db:5432/dfds
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      HOST: 0.0.0.0
      PORT: 8766
    ports:
      - "8766:8766"

volumes:
  dfds_pgdata:
